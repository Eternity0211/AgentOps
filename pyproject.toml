[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentops-incident-commander"
version = "0.1.0"
description = "Evidence-driven microservice incident diagnosis and controlled recovery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "AgentOps contributors" },
]
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<0.32",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "langgraph>=1.2.12,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "opentelemetry-api>=1.45,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
    "opentelemetry-sdk>=1.45,<1.46",
    "pgvector>=0.5,<0.6",
    "pydantic>=2.13,<3",
    "redis>=8.1,<8.2",
    "sqlalchemy[asyncio]>=2.1.2,<2.2",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
agentops-api = "agentops_incident_commander.apps.api:main"
agentops-worker = "agentops_incident_commander.apps.worker:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
    "testcontainers[postgres]>=4.15,<5",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_incident_commander"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = [".python", ".uv-cache"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=agentops_incident_commander",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["agentops_incident_commander"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
