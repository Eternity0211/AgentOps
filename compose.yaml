name: ${COMPOSE_PROJECT_NAME:-agentops}

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true

x-small-resources: &small-resources
  cpus: 0.50
  mem_limit: 512m
  pids_limit: 200

services:
  gateway:
    <<: [*runtime-defaults, *small-resources]
    image: agentops-simulator:local
    build:
      context: .
      dockerfile: Dockerfile.simulator
    cap_drop: [ALL]
    profiles: [simulator]
    command: [gateway]
    environment:
      ORDER_SERVICE_URL: http://order:8000
      OTEL_SDK_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_TIMEOUT_SECONDS: 2
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: 5000
      DEPLOYMENT_ENVIRONMENT: local
      SERVICE_VERSION: ${GATEWAY_SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ID: ${GATEWAY_DEPLOYMENT_ID:-baseline-gateway-v1}
      PREVIOUS_SERVICE_VERSION: ${GATEWAY_PREVIOUS_VERSION:-}
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports:
      - name: gateway-http
        target: 8000
        published: ${GATEWAY_PORT:-8080}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    networks: [ingress, simulator]
    depends_on:
      order:
        condition: service_healthy
    healthcheck: &simulator-healthcheck
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order:
    <<: [*runtime-defaults, *small-resources]
    image: agentops-simulator:local
    build:
      context: .
      dockerfile: Dockerfile.simulator
    cap_drop: [ALL]
    profiles: [simulator]
    command: [order]
    environment:
      INVENTORY_SERVICE_URL: http://inventory:8000
      PAYMENT_SERVICE_URL: http://payment:8000
      SIMULATOR_DB_HOST: simulator-postgres
      SIMULATOR_DB_PORT: 5432
      SIMULATOR_DB_NAME: ${SIMULATOR_DB_NAME:-commerce}
      SIMULATOR_DB_USER: ${SIMULATOR_DB_USER:-simulator}
      SIMULATOR_DB_PASSWORD_FILE: /run/secrets/simulator_db_password
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      OTEL_SDK_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_TIMEOUT_SECONDS: 2
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: 5000
      DEPLOYMENT_ENVIRONMENT: local
      SERVICE_VERSION: ${ORDER_SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ID: ${ORDER_DEPLOYMENT_ID:-baseline-order-v1}
      PREVIOUS_SERVICE_VERSION: ${ORDER_PREVIOUS_VERSION:-}
    secrets: [simulator_db_password]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [simulator]
    depends_on:
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
      simulator-postgres:
        condition: service_healthy
    healthcheck: *simulator-healthcheck

  inventory:
    <<: [*runtime-defaults, *small-resources]
    image: agentops-simulator:local
    build:
      context: .
      dockerfile: Dockerfile.simulator
    cap_drop: [ALL]
    profiles: [simulator]
    command: [inventory]
    environment:
      SIMULATOR_REDIS_HOST: simulator-redis
      SIMULATOR_REDIS_PORT: 6379
      SIMULATOR_REDIS_PASSWORD_FILE: /run/secrets/simulator_redis_password
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      OTEL_SDK_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_TIMEOUT_SECONDS: 2
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: 5000
      DEPLOYMENT_ENVIRONMENT: local
      SERVICE_VERSION: ${INVENTORY_SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ID: ${INVENTORY_DEPLOYMENT_ID:-baseline-inventory-v1}
      PREVIOUS_SERVICE_VERSION: ${INVENTORY_PREVIOUS_VERSION:-}
    secrets: [simulator_redis_password]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [simulator]
    depends_on:
      simulator-redis:
        condition: service_healthy
    healthcheck: *simulator-healthcheck

  payment:
    <<: [*runtime-defaults, *small-resources]
    image: agentops-simulator:local
    build:
      context: .
      dockerfile: Dockerfile.simulator
    cap_drop: [ALL]
    profiles: [simulator]
    command: [payment]
    environment:
      OTEL_SDK_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_TIMEOUT_SECONDS: 2
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: 5000
      DEPLOYMENT_ENVIRONMENT: local
      SERVICE_VERSION: ${PAYMENT_SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ID: ${PAYMENT_DEPLOYMENT_ID:-baseline-payment-v1}
      PREVIOUS_SERVICE_VERSION: ${PAYMENT_PREVIOUS_VERSION:-}
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [simulator]
    healthcheck: *simulator-healthcheck

  control-postgres:
    <<: [*runtime-defaults, *small-resources]
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    profiles: [control-plane]
    environment:
      POSTGRES_DB: ${CONTROL_DB_NAME:-agentops}
      POSTGRES_USER: ${CONTROL_DB_USER:-agentops}
      POSTGRES_PASSWORD_FILE: /run/secrets/control_db_password
    secrets: [control_db_password]
    volumes:
      - control_postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=3775
    networks: [control-plane]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  simulator-postgres:
    <<: [*runtime-defaults, *small-resources]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [simulator]
    environment:
      POSTGRES_DB: ${SIMULATOR_DB_NAME:-commerce}
      POSTGRES_USER: ${SIMULATOR_DB_USER:-simulator}
      POSTGRES_PASSWORD_FILE: /run/secrets/simulator_db_password
    secrets: [simulator_db_password]
    volumes:
      - simulator_postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=3775
    networks: [simulator]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  simulator-redis:
    <<: [*runtime-defaults, *small-resources]
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    profiles: [simulator]
    command:
      - /bin/sh
      - -ec
      - >-
        printf 'requirepass %s\n' "$$(cat /run/secrets/simulator_redis_password)"
        > /tmp/redis.conf;
        exec redis-server /tmp/redis.conf --appendonly yes --maxmemory 192mb
        --maxmemory-policy allkeys-lru
    secrets: [simulator_redis_password]
    volumes:
      - simulator_redis_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [simulator]
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/simulator_redis_password)" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    <<: [*runtime-defaults, *small-resources]
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alert_rules
        target: /etc/prometheus/rules/agentops-alerts.yml
    volumes:
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - name: prometheus-http
        target: 9090
        published: ${PROMETHEUS_PORT:-9090}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    networks: [observability, observability-ingress]
    healthcheck:
      test: [CMD, /bin/prometheus, --version]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  loki:
    <<: [*runtime-defaults, *small-resources]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: [observability]
    command: [-config.file=/etc/loki/config.yml]
    configs:
      - source: loki_config
        target: /etc/loki/config.yml
    volumes:
      - loki_data:/loki
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - name: loki-http
        target: 3100
        published: ${LOKI_PORT:-3100}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    networks: [observability, observability-ingress]
    healthcheck:
      test: [CMD, /usr/bin/loki, -version]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  tempo:
    <<: [*runtime-defaults, *small-resources]
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    profiles: [observability]
    command: [-config.file=/etc/tempo/config.yml]
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yml
    volumes:
      - tempo_data:/var/tempo
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - name: tempo-http
        target: 3200
        published: ${TEMPO_PORT:-3200}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    networks: [observability, observability-ingress]
    healthcheck:
      test: [CMD, /tempo, -version]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  otel-collector:
    <<: [*runtime-defaults, *small-resources]
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yml]
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yml
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [simulator, observability]
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yml
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    <<: [*runtime-defaults, *small-resources]
    image: grafana/grafana:13.1.5@sha256:3e98fc105d68d282569ed7459223cd57e0c77b633be9bfa86a3ff93239b466b0
    profiles: [observability]
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-agentops-admin}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/agentops.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/agentops.yml
      - source: grafana_diagnosed_dashboard
        target: /etc/grafana/dashboards/diagnosed-system.json
      - source: grafana_control_plane_dashboard
        target: /etc/grafana/dashboards/agent-platform.json
    volumes:
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - name: grafana-http
        target: 3000
        published: ${GRAFANA_PORT:-3000}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    networks: [observability, observability-ingress]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  ingress:
    internal: false
  control-plane:
    internal: true
  simulator:
    internal: true
  observability:
    internal: true
  observability-ingress:
    internal: false

volumes:
  control_postgres_data:
  simulator_postgres_data:
  simulator_redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

configs:
  prometheus_config:
    file: ./config/observability/prometheus.yml
  prometheus_alert_rules:
    file: ./config/observability/alerts.yml
  loki_config:
    file: ./config/observability/loki.yml
  tempo_config:
    file: ./config/observability/tempo.yml
  otel_collector_config:
    file: ./config/observability/otel-collector.yml
  grafana_datasources:
    file: ./config/observability/grafana/datasources.yml
  grafana_dashboard_provider:
    file: ./config/observability/grafana/dashboards.yml
  grafana_diagnosed_dashboard:
    file: ./config/observability/grafana/diagnosed-system.json
  grafana_control_plane_dashboard:
    file: ./config/observability/grafana/agent-platform.json

secrets:
  control_db_password:
    file: ${CONTROL_DB_PASSWORD_FILE:?set CONTROL_DB_PASSWORD_FILE to a local secret file}
  simulator_db_password:
    file: ${SIMULATOR_DB_PASSWORD_FILE:?set SIMULATOR_DB_PASSWORD_FILE to a local secret file}
  simulator_redis_password:
    file: ${SIMULATOR_REDIS_PASSWORD_FILE:?set SIMULATOR_REDIS_PASSWORD_FILE to a local secret file}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?set GRAFANA_ADMIN_PASSWORD_FILE to a local secret file}
