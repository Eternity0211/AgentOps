repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-lint
        name: ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy strict
        entry: uv run --frozen mypy src tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
