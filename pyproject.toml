[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentops-incident-commander"
version = "0.1.0"
description = "Evidence-driven microservice incident diagnosis and controlled recovery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "AgentOps contributors" },
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_incident_commander"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".python", ".uv-cache"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=agentops_incident_commander",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["agentops_incident_commander"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
